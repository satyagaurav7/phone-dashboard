<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07191C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FLOWSTATE">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>FLOWSTATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<!-- Two families, one request. Clash Display was dropped in FLOWSTATE II: five
     separate CSS comments in this file documented it being tightened to fit
     375px, and it still forced horizontal scroll in grid cells. Satoshi 700/900
     carries display duty at the same weight without the width. -->
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ————— FLOWSTATE II — semantic token layer —————
       Source of truth. The archaeological passport-era names below are kept as
       ALIASES so every existing rule reskins from here instead of being edited. */
    --surface-0:#0A0D13;   /* page canvas — deepest        */
    --surface-1:#111624;   /* standard card    (L1)        */
    --surface-2:#161D2E;   /* inset well       (L0)        */
    --surface-3:#0E1420;   /* raised hero/nav  (L2)        */
    --hairline:#232B3E;    /* default border               */
    --hairline-hi:#2E3752; /* border on raised surfaces    */
    --text-1:#E6EBF5;      /* primary text                 */
    --text-2:#8A94AD;      /* secondary text               */
    --text-3:#B9C6DE;      /* on-hero secondary            */

    --accent-flow:#4FD8EB;   /* progress / momentum — earned light */
    --accent-money:#5BE9A6;  /* the money hero (Phase 2)          */
    --accent-warn:#E8A13C;   /* pace + urgency — never shame red  */
    --accent-pr:#C9A227;     /* gold — the PR narrative           */
    --accent-alt:#8B7CF6;    /* violet — secondary                */

    /* elevation: L0 recessed · L1 standard · L2 hero */
    --elev-0:inset 0 2px 6px -2px rgba(0,0,0,.55);
    --elev-1:0 4px 14px -10px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.035);
    --elev-2:0 18px 44px -26px rgba(0,0,0,.95), 0 2px 0 -1px rgba(255,255,255,.05) inset;
    --r-sm:8px; --r-md:11px; --r-lg:16px;

    /* ————— aliases (do not use in new rules) ————— */
    --passport:var(--surface-3);
    --page:var(--surface-0);
    --ink:var(--text-1);
    --maple:var(--accent-warn);
    --customs:var(--accent-flow);
    --foil:var(--accent-pr);
    --violet:var(--accent-alt);
    --line:var(--hairline); --sub:var(--text-2);
    --card:var(--surface-1); --well:var(--surface-2);

    --disp:'Satoshi','Public Sans',system-ui,sans-serif;
    --body:'Satoshi','Public Sans',system-ui,sans-serif;
    --mono:'B612 Mono',ui-monospace,monospace;

    /* mood layer — set live from JS (momentum + time of day) */
    --mood-hue:0deg; --mood-intensity:1; --mood-sat:1;
    /* The two gradient poles, as bare RGB triplets so rgba() can take an alpha.
       These were hardcoded cyan/violet, which meant the gradient stack fought
       any mood that wasn't cyan/violet — the warm moods composited to brown.
       applyMood() now sets them per mood so the whole screen shifts together. */
    --mood-c1:79,216,235; --mood-c2:139,124,246;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--surface-0);
    color:var(--text-1);font-family:var(--body);font-size:16px;line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  /* ============ mood layer ============
     Was: four radial-gradients painted on <body> with background-attachment:fixed,
     which meant the "aurora" literally never moved and the screen looked identical
     at momentum 8 and momentum 88. Now it's its own compositing layer that
     drifts, and its hue / intensity / saturation are driven from JS via the
     --mood-* custom properties (see applyMood()).

     The unlockable mood art lives in moods/<name>.svg and is layered by the
     ::before below, underneath these gradients. It inherits this element's
     drift animation and hue/saturate filter for free, because filter and
     transform both apply to the element and its pseudo-children as a group. */
  #moodLayer{
    position:fixed;inset:-12% -12% -12% -12%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(ellipse 78% 48% at 16% 4%,  rgba(var(--mood-c1),calc(.20 * var(--mood-intensity))), transparent 62%),
      radial-gradient(ellipse 70% 44% at 86% 12%, rgba(var(--mood-c2),calc(.17 * var(--mood-intensity))), transparent 60%),
      radial-gradient(ellipse 104% 54% at 52% 46%,rgba(var(--mood-c1),calc(.07 * var(--mood-intensity))), transparent 70%),
      radial-gradient(ellipse 82% 54% at 18% 98%, rgba(var(--mood-c2),calc(.11 * var(--mood-intensity))), transparent 66%);
    background-size:cover;background-position:center;
    filter:hue-rotate(var(--mood-hue)) saturate(var(--mood-sat));
    animation:moodDrift 44s ease-in-out infinite;
    transition:filter 1.2s ease-out;
    will-change:transform;
  }
  /* The mood art needs its OWN layer rather than a slot in the shorthand above.
     --mood-intensity scales the gradients through calc() inside their rgba(), but
     a background-image's alpha can't be reached that way — so as a background
     layer the SVG would sit at full strength at momentum 0 while the gradients
     dimmed, quietly re-breaking the "looks identical at 8 and 88" problem this
     whole layer exists to fix. As a pseudo-element its opacity is bound too. */
  #moodLayer::before{
    content:'';position:absolute;inset:0;
    background-image:var(--mood-img,none);
    background-size:cover;background-position:center;
    opacity:calc(.22 * var(--mood-intensity) * var(--mood-art-k,1));  /* ~.24 at the fixed 1.10 intensity */
    transition:opacity 1.2s ease-out;
    /* Vertical falloff — the art has to yield to the content below the ring.
       Cards are opaque --surface-1 (L*7.4). Measured over the real rasterised
       SVGs, an unmasked layer put the page behind the cards at L* 9.3-15.3 at
       deep flow: brighter than the cards themselves, so every card read as a
       hole punched in a glowing screen rather than a surface floating above it.
       The hero band is card-free, so the art keeps full strength where the
       momentum ring sits and falls off through the scroll body.
       Stops chosen by sweeping candidates through the measurement harness: the
       hero band only loses 0.9 L* between the loosest and this, while worst-case
       card-band lightness drops 9.5 -> 6.5 (surface-1 is 7.4). The falloff is
       nearly free where the art matters and decisive where the cards are. */
    -webkit-mask-image:linear-gradient(to bottom,
      #000 0, #000 28%, rgba(0,0,0,.16) 58%, rgba(0,0,0,.10) 100%);
    mask-image:linear-gradient(to bottom,
      #000 0, #000 28%, rgba(0,0,0,.16) 58%, rgba(0,0,0,.10) 100%);
  }
  @keyframes moodDrift{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%    {transform:translate3d(2.2%,-1.6%,0) scale(1.05)}
    66%    {transform:translate3d(-1.8%,1.9%,0) scale(1.03)}
  }
  #appRoot{max-width:780px;margin:0 auto;padding:14px 14px calc(104px + env(safe-area-inset-bottom));display:none}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
  :focus-visible{outline:3px solid var(--foil);outline-offset:2px;border-radius:4px}

  /* ============ hero — elevation L2 ============ */
  .cover{position:relative;border-radius:var(--r-lg);color:#fff;padding:16px 18px 4px;overflow:hidden;
    background:linear-gradient(158deg,#131C30 0%,var(--surface-3) 58%);
    border:1.5px solid var(--hairline-hi);border-top:2px solid rgba(79,216,235,.6);
    box-shadow:var(--elev-2)}
  /* A single sheen across the top edge — the cue that this surface is raised. */
  .cover::before{content:"";position:absolute;inset:0 0 auto;height:52%;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.055),transparent)}
  .cover > *{position:relative;z-index:1}
  .cover .kicker{font-family:var(--disp);font-weight:700;letter-spacing:.3em;font-size:11.5px;color:var(--accent-pr);text-transform:uppercase}
  .cover h1{font-family:var(--disp);font-weight:900;font-size:29px;margin:4px 0 0;letter-spacing:-.02em;line-height:1.1}
  .cover .date{font-family:var(--mono);font-size:12.5px;color:var(--text-3);margin-top:3px}
  .heroRow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 0}
  .streakBig{font-family:var(--mono);font-weight:700;font-size:36px;line-height:1;color:#fff}
  .streakLbl{font-family:var(--disp);font-weight:700;letter-spacing:.16em;font-size:11px;color:var(--text-3);text-transform:uppercase;margin-top:3px}
  .bestLbl{font-family:var(--mono);font-size:11px;color:var(--accent-pr);margin-top:6px;line-height:1.35}
  .statusLine{font-family:var(--disp);font-weight:700;font-size:16.5px;letter-spacing:-.005em;line-height:1.35;color:#EAD9A0;padding:0 0 14px}
  #syncStatus{font-family:var(--mono);font-size:11px;color:var(--accent-pr);opacity:.85;margin-top:2px}
  .xpWrap{padding:0 0 14px}
  .xpTop{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:600;letter-spacing:.14em;font-size:12px;color:var(--foil);text-transform:uppercase;margin-bottom:5px}
  .xpBar{height:8px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden}
  .xpFill{height:100%;background:var(--foil)}
  .xpSub{font-family:var(--mono);font-size:11px;color:#B9C6DE;margin-top:4px}

  /* ============ cards — three elevation levels ============
     Every card used to be var(--card) + a 1.5px hairline, so Supplements carried
     exactly the same visual weight as the Anchor. Now the surface itself says
     how much a card matters. */
  .card{background:var(--surface-1);border:1.5px solid var(--hairline);border-radius:var(--r-md);
    padding:16px;margin-top:14px;box-shadow:var(--elev-1)}
  /* L2 — primary. What the day is actually asking for. */
  .card--hero{background:linear-gradient(158deg,#141D31,var(--surface-3) 62%);
    border-color:var(--hairline-hi);border-top:2px solid rgba(79,216,235,.5);
    border-radius:var(--r-lg);box-shadow:var(--elev-2)}
  /* L0 — recessed. Reference material: read it, don't be pulled by it. */
  .card--quiet{background:var(--surface-2);border-color:#1D2436;box-shadow:var(--elev-0)}
  .card--quiet .secTitle h2{color:var(--text-2)}

  .secTitle{display:flex;align-items:center;gap:9px;margin:0 0 12px}
  .secTitle .ic{flex:0 0 auto;width:17px;height:17px;color:var(--text-2);opacity:.85}
  .secTitle .no{font-family:var(--mono);font-size:10.5px;color:var(--text-2);letter-spacing:.06em}
  .secTitle h2{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.17em;text-transform:uppercase;margin:0}
  .secTitle .tally{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:13px}

  /* icon sprite: inherits colour, never a font, never a network request */
  .ic{display:inline-block;width:1em;height:1em;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}

  /* stamp rows */
  .row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border:1.5px solid var(--line);
    border-radius:11px;margin-bottom:8px;cursor:pointer;user-select:none;
    background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,0) 55%),var(--well);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 4px 14px -10px rgba(0,0,0,.85);
    transition:transform .12s cubic-bezier(.2,.8,.3,1),border-color .25s,box-shadow .3s,background .25s}
  .row:active{transform:scale(.975)}
  .row .emo{font-size:19px;flex:0 0 auto}
  .row .lbl{font-weight:600;font-size:15.5px}
  .row .subt{font-size:12.5px;color:var(--sub);font-weight:400;margin-top:1px}
  .row .spacer{flex:1}
  .stamp{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;
    border:2px dashed #3A4560;color:var(--sub);border-radius:6px;padding:7px 10px;transform:rotate(0)}
  .row.done{background:linear-gradient(160deg,rgba(79,216,235,.17),rgba(79,216,235,.04) 62%),var(--well);
    border-color:rgba(79,216,235,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(79,216,235,.13), 0 0 22px -8px rgba(79,216,235,.6)}
  .row.done .stamp{border:2px solid var(--customs);color:var(--customs);background:rgba(79,216,235,.08);transform:rotate(-3deg)}
  /* the slam only plays on the row you JUST tapped — see .justDone below */
  .row.done.justDone .stamp{animation:slam .28s cubic-bezier(.2,1.6,.5,1)}
  .row.navyInk.done{background:linear-gradient(160deg,rgba(139,124,246,.17),rgba(139,124,246,.04) 62%),var(--well);
    border-color:rgba(139,124,246,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(139,124,246,.13), 0 0 22px -8px rgba(139,124,246,.6)}
  .row.navyInk.done .stamp{border-color:var(--violet);color:var(--violet);background:rgba(139,124,246,.08)}
  .row.mapleInk.done{background:linear-gradient(160deg,rgba(201,162,39,.17),rgba(201,162,39,.04) 62%),var(--well);
    border-color:rgba(201,162,39,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(201,162,39,.13), 0 0 22px -8px rgba(201,162,39,.6)}
  .row.mapleInk.done .stamp{border-color:var(--foil);color:var(--foil);background:rgba(201,162,39,.08)}
  @keyframes slam{0%{transform:rotate(7deg) scale(1.5);opacity:0}60%{transform:rotate(-5deg) scale(.96);opacity:1}100%{transform:rotate(-3deg) scale(1)}}
  .timeWrap{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-right:2px}
  .timeWrap input{font-family:var(--mono);font-size:13px;border:1.5px solid var(--line);border-radius:5px;padding:5px 6px;color:var(--ink);background:var(--well)}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;border:1.5px solid var(--line);background:var(--well);border-radius:4px;padding:8px 12px;color:var(--ink)}
  /* ---- daily check-in (P1) ---- */
  .chip.on{border-color:var(--customs);color:var(--customs);background:linear-gradient(160deg,rgba(79,216,235,.16),rgba(79,216,235,.04))}
  .ciQ{font-size:13px;font-weight:600;color:var(--ink);margin:14px 0 8px}
  .ciQ:first-of-type{margin-top:4px}
  .ciRow{display:flex;flex-wrap:wrap;gap:7px}
  .ciText{width:100%;box-sizing:border-box;margin-top:8px;font:inherit;font-size:13px;color:var(--ink);
    background:var(--well);border:1.5px solid var(--line);border-radius:6px;padding:10px 11px}
  .ciText:focus{outline:none;border-color:var(--customs)}
  .ciDone{font-size:13px;color:var(--sub);line-height:1.45}
  .ciHint{font-size:12px;color:var(--text-2);margin-top:10px;line-height:1.45}
  .ciClose{border-color:rgba(79,216,235,.6);color:var(--customs);font-weight:700}
  .rmRow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .rmRow:last-of-type{border-bottom:0}
  .rmRow>div:first-child{flex:1;min-width:0}
  .rmLbl{font-size:13px;font-weight:600;color:var(--ink)}
  .rmSub{font-size:11.5px;color:var(--text-2);line-height:1.4;margin-top:2px}
  .ciFoot{margin-top:12px;font-size:11px;color:var(--text-2)}
  .ciLink{background:none;border:0;padding:0;font:inherit;font-size:11px;color:var(--text-2);text-decoration:underline;cursor:pointer}
  .chip b{color:var(--customs)}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{border:1.5px solid var(--line);background:var(--well);border-radius:8px;padding:14px;position:relative;cursor:pointer;transition:border-color .15s;width:100%}
  .tile:hover{border-color:var(--customs)}
  .tile .dot{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--card)}
  .tile .big{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1.05}
  .tile .cap{font-family:var(--disp);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px;color:var(--sub);margin-top:7px}
  .tile .amend{font-family:var(--mono);font-size:10.5px;color:var(--sub);margin-top:6px;opacity:.8}
  .t-good .big{color:var(--customs)} .t-warn .big{color:#E8B45A} .t-bad .big{color:var(--maple)} .t-idle .big{color:var(--ink)}
  .d-good{background:var(--customs)} .d-warn{background:#C98A00} .d-bad{background:var(--maple)} .d-idle{background:#3A4560}

  /* two-up on wide screens */
  .grid2{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:760px){ .grid2{grid-template-columns:1fr 1fr;gap:14px;align-items:start} .grid2 > .card{margin-top:14px} }

  /* health */
  .hcard p{margin:6px 0 0;font-size:14.5px;color:var(--ink)}
  .hcard .sub{color:var(--sub);font-size:13px}

  /* ============ timetable (Plan tab) ============ */
  .tl{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1.5px solid var(--line);
    border-radius:6px;margin-bottom:6px;background:var(--well);cursor:pointer;user-select:none}
  .tl:active{transform:scale(.995)}
  .tl .tlt{font-family:var(--mono);font-size:11.5px;color:var(--sub);flex:0 0 86px;line-height:1.3}
  .tl .emo{font-size:16px;flex:0 0 auto}
  .tl .lbl{font-weight:600;font-size:14px}
  .tl .st{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;
    border:2px dashed #3A4560;color:var(--sub);border-radius:5px;padding:4px 7px;flex:0 0 auto;white-space:nowrap}
  .tl.done{background:rgba(79,216,235,.08);border-color:rgba(79,216,235,.45)}
  .tl.done .st{border-style:solid;border-color:var(--customs);color:var(--customs);transform:rotate(-3deg)}
  .tl.fail{opacity:.55}
  .tl.fail .st{border-style:solid;border-color:#3A4560;color:var(--sub)}
  .tl.now{border-color:var(--customs);background:rgba(79,216,235,.08);box-shadow:0 0 16px -6px rgba(79,216,235,.55)}
  .tl.now .st{border-color:var(--customs);color:var(--customs)}
  .wkRow{display:flex;gap:6px;margin-bottom:12px}
  .dayChip{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:6px;background:var(--well);padding:7px 2px;cursor:pointer}
  .dayChip .dn{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
  .dayChip .dd{font-family:var(--mono);font-weight:700;font-size:14px;margin-top:1px}
  .dayChip.sel{border-color:var(--customs);background:rgba(79,216,235,.08)}
  .dayChip.tdy .dn{color:var(--customs)}

  /* ============ history heatmap ============ */
  .hmWrap{overflow-x:auto;padding-bottom:4px}
  .hmMonths{display:flex;gap:3px;height:14px;margin:0 0 4px;font-family:var(--mono);font-size:10px;color:var(--sub)}
  .hmMonths span{width:13px;flex:0 0 auto;overflow:visible;white-space:nowrap}
  .hmGrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px}
  .hmCell{width:13px;height:13px;border-radius:3px;border:1px solid var(--line);background:#131A29;padding:0;cursor:pointer}
  .hmCell.part{background:rgba(79,216,235,.32);border-color:rgba(79,216,235,.5)}
  .hmCell.full{background:var(--customs);border-color:var(--customs);box-shadow:0 0 6px -1px rgba(79,216,235,.7)}
  .hmCell.today{outline:2px solid var(--customs);outline-offset:1px}
  .hmDow{display:grid;grid-template-rows:repeat(7,13px);gap:3px;margin:18px 6px 0 0;font-family:var(--mono);font-size:9px;color:var(--sub);flex:0 0 auto}
  .hmLegend{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .hmLegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* ============ bottom nav ============ */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom);
    background:rgba(14,20,32,.86);backdrop-filter:blur(14px) saturate(1.3);
    border-top:1px solid var(--hairline-hi);box-shadow:0 -12px 30px -20px rgba(0,0,0,.9)}
  .navIn{max-width:780px;margin:0 auto;display:flex}
  .navBtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 2px 13px;color:#5A6684;position:relative;
    transition:color .2s ease-out}
  .navBtn .ic{width:21px;height:21px;stroke-width:1.9}
  .navBtn .nLbl{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
  .navBtn.on{color:#fff}
  .navBtn.on .ic{color:var(--accent-flow);filter:drop-shadow(0 0 7px rgba(79,216,235,.65))}
  .navBtn.on::after{content:"";position:absolute;top:-1px;left:24%;right:24%;height:2px;border-radius:2px;

        <text x="80" y="97" text-anchor="middle" font-family="Satoshi,system-ui,sans-serif" font-weight="700" font-size="10.5" fill="#4FD8EB" letter-spacing="2.6">${st[2].toUpperCase()}</text>
        ${todayGain>0?`<text x="80" y="115" text-anchor="middle" font-family="B612 Mono,monospace" font-size="10.5" fill="#C9A227">+${todayGain} today</text>`:''}
      </svg></div>`;
    }

    function rowHTML(path, emo, lbl, sub, state, inkClass, extra, doneAt){
      const cls = state===true?'done':'';
      const stamp = state===true?(doneAt?`✓ ${doneAt}`:'DONE ✓'):'TAP';
      return `<div class="row ${cls} ${inkClass||''}" role="button" tabindex="0" aria-pressed="${state===true}" aria-label="${lbl}: ${state===true?'done':'not yet'}" data-toggle="${path}">
        <span class="emo" aria-hidden="true">${emo}</span>
        <span><span class="lbl">${lbl}</span>${sub?`<div class="subt">${sub}</div>`:''}</span>
        <span class="spacer"></span>${extra||''}
        <span class="stamp">${stamp}</span>
      </div>`;
    }
    /* Section headers: one vector icon, the title, an optional right-aligned
       tally. Every key below is mapped, because the half-mapped version put a
       mono kicker AND an icon on some headers and read "⚡ SMALL SMALL WINS" —
       the kicker existed only because there was no iconography before. It now
       survives solely as a fallback for a key nobody has drawn a glyph for. */
    const SEC_ICONS={
      '⚓':'anchor','NOW':'clock','SMALL':'spark','BIG':'bolt','WINS':'bolt',
      'FUEL':'flame','SUPP':'pill','MED':'pill','LEAKS':'arrowdown','KEEL':'shield',
      'PLAN':'calendar','TIMETABLE':'clock','ROUTE':'route','CAR':'car','FOOD':'cart',
      'VISA':'leaf','LANG':'file','FILE':'file','NOTE':'file','AUDIT':'file','CLAIM':'file',
      'ALERT':'bell','WATCH':'bell','RECORD':'calendar','LOG':'calendar',
      'LEDGER':'cash','WEEK':'cash','VAULT':'lock','TRUTH':'shield','TREND':'pulse'
    };
    function secTitle(no,txt,tally,tone){
      const ic=SEC_ICONS[no];
      const lead=ic?icon(ic):`<span class="no">${no}</span>`;
      return `<div class="secTitle">${lead}<h2>${txt}</h2>${tally?`<span class="tally" style="color:${tone||'var(--text-2)'}">${tally}</span>`:''}</div>`;
    }
    function tileHTML(key,big,cap,tone){
      return `<button class="tile t-${tone}" data-edit="${key}">
        <span class="dot d-${tone}" aria-hidden="true"></span>
        <div class="big">${big}</div><div class="cap">${cap}</div>
        <div class="amend">TAP TO AMEND ✎</div>
      </button>`;
    }

    /* ---------- daily check-in (P1) ----------
       Two short cards: capacity + first step in the morning, evidence +
       obstacle in the evening. Every field is optional and skipping is free —
       there is no score attached, no streak to protect, and no follow-up
       interrogation (A12). A low-capacity answer offers a SMALLER discretionary
       action; it never touches an appointment, a due date, or anything medical
       (A13). Mood is recorded only because it changes what gets suggested, and
       it never changes what an action is worth (A14).

       Storage is S.checkIns[date]; nothing here writes to S.days, so deleting
       every check-in leaves the record of what was actually done intact (A21). */
    /* Stored answers are free text the user typed. They are rendered back into
       innerHTML, so every interpolation of them must be escaped — otherwise a
       note containing markup executes as markup. escAttr also escapes & so an
       entity typed literally survives a round trip instead of decoding. */
    const escHtml = v => String(v==null?'':v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const escAttr = v => escHtml(v).replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    const CAPACITY=[['low','Low'],['usual','Usual'],['plenty','Plenty']];
    const FEELINGS=[['calm','Calm'],['tense','Tense'],['flat','Flat'],['distracted','Distracted']];
    const OBSTACLES=[['toomuch','Too much planned'],['unclear','Unclear next step'],['tired','Tired'],['interrupted','Interrupted'],['waiting','Waiting on someone']];

    const ciChip=(field,val,label,on)=>
      `<button class="chip${on?' on':''}" data-ci="${field}:${val}" aria-pressed="${on?'true':'false'}">${label}</button>`;

    function checkInCard(s,d){

    function activityHTML(s,d){

        <span class="stamp">$${amt}</span></div>`).join('');
      const fineLog = fines.length
        ? `<div style="font-size:12.5px;color:var(--sub);margin-top:6px;font-family:var(--mono)">Logged today: ${fines.map(k=>{const f=FINES.find(x=>x[0]===k);return f?f[1]:k;}).join(' ')} · $${fineTotal} <button data-fineundo style="color:var(--sub);text-decoration:underline;font-family:var(--mono);font-size:12px">undo last</button></div>`

        return rowHTML(`days.${Dash.today}.${k}`,e,l,t,d[k],k==='insulin'?'navyInk':'',null,d.log&&d.log[k]);
      }).join('');
      const suppDone = SUPPS.filter(([k])=>d[k]===true).length;
      const suppRows = SUPPS.map(([k,l,sub])=>rowHTML(`days.${Dash.today}.${k}`,'💊',l,sub+(IT[k]?' · ~'+IT[k]:''),d[k],'navyInk',null,d.log&&d.log[k])).join('');
      const chips = GUARDRAILS.map(([b,rest])=>`<span class="chip"><b>${b}</b> ${rest}</span>`).join('');

      return `${anchorCard}
        <div class="card">

          ${bigRows}

            ${fuelRows}

`;

            ${tileHTML('permit', pD==null?'—':pD, 'days · work permit', pD!=null&&pD<150?'bad':'warn')}

    /* ================= Money charts =================
       Hand-rolled inline SVG — no chart library, so the single-file PWA and its
       offline behaviour stay intact.
       Palette was VALIDATED, not eyeballed, against the dark card surface
       (#111624): lightness band, chroma floor, CVD separation (worst adjacent
       ΔE 9.4 deutan), normal-vision floor (24.6) and contrast all pass.
       The app's brand cyan #4FD8EB FAILED the dark lightness band (0.816 vs
       0.48–0.67) and gold↔amber FAILED CVD separation (ΔE 1.9 — indistinguishable),
       so chart cyan is stepped down to #309FB3 and gold is dropped entirely. */
    const CHART={c1:'#309FB3',c2:'#d95926',c3:'#199e70',c4:'#9085e9'};
    const money0=v=>'$'+Math.round(v).toLocaleString();
    const AXIS='#232B3E', INK='#E6EBF5', MUTED='#8A94AD', FAINT='#5C6780';

    function chartLegend(series){
      return `<div style="display:flex;flex-wrap:wrap;gap:11px;margin-top:9px">`+
        series.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub)"><i aria-hidden="true" style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block;flex:0 0 auto"></i>${s.name}</span>`).join('')+
        `</div>`;
    }

    /* Stacked columns. cats=[label], series=[{name,color,vals[]}] */
    function svgStacked(cats, series, opts){
      opts=opts||{};
      const W=320, H=opts.h||200, top=16, base=H-46;
      const totals=cats.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0));
      const max=Math.max(...totals)*1.08;
      const bw=opts.bw||52, gap=(W-12-cats.length*bw)/(cats.length-1);
      let out='';
      cats.forEach((c,i)=>{
        const x=6+i*(bw+gap);
        let y=base;
        series.forEach(s=>{
          const v=s.vals[i]; if(v<=0) return;
          const hh=v/max*(base-top); y-=hh;
          // 2px surface gap between stacked segments per mark spec
          out+=`<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(hh-2,1.5).toFixed(1)}" rx="3" fill="${s.color}"><title>${c} · ${s.name}: ${money0(v)}</title></rect>`;
        });
        out+=`<text x="${x+bw/2}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-family="B612 Mono,monospace" font-size="11" font-weight="700" fill="${INK}">${money0(totals[i])}</text>`;
        out+=`<text x="${x+bw/2}" y="${base+16}" text-anchor="middle" font-family="Satoshi,system-ui,sans-serif" font-weight="600" font-size="11.5" letter-spacing=".08em" fill="${MUTED}">${c.toUpperCase()}</text>`;
        if(opts.sub&&opts.sub[i]) out+=`<text x="${x+bw/2}" y="${base+29}" text-anchor="middle" font-family="B612 Mono,monospace" font-size="8.5" fill="${FAINT}">${opts.sub[i]}</text>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${opts.alt||''}"><line x1="6" y1="${base}" x2="${W-6}" y2="${base}" stroke="${AXIS}" stroke-width="1"/>${out}</svg>`;
    }

    /* Grouped columns. cats=[label], series=[{name,color,vals[]}] */
    function svgGrouped(cats, series, opts){
      opts=opts||{};
      const W=320, H=opts.h||200, top=16, base=H-46;
      const max=Math.max(...series.flatMap(s=>s.vals))*1.12;
      const grpW=(W-12)/cats.length, bw=Math.min(30,(grpW-14)/series.length);
      let out='';
      cats.forEach((c,i)=>{
        const gx=6+i*grpW+(grpW-(bw*series.length+2*(series.length-1)))/2;
        series.forEach((s,j)=>{
          const v=s.vals[i], hh=v/max*(base-top);
          const x=gx+j*(bw+2), y=base-hh;   // 2px gap between adjacent bars
          out+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hh,1.5).toFixed(1)}" rx="3" fill="${s.color}"><title>${c} · ${s.name}: ${money0(v)}</title></rect>`;
          out+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-family="B612 Mono,monospace" font-size="9.5" font-weight="700" fill="${INK}">${money0(v)}</text>`;
        });
        out+=`<text x="${(6+i*grpW+grpW/2).toFixed(1)}" y="${base+16}" text-anchor="middle" font-family="Satoshi,system-ui,sans-serif" font-weight="600" font-size="11" letter-spacing=".06em" fill="${MUTED}">${c.toUpperCase()}</text>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${opts.alt||''}"><line x1="6" y1="${base}" x2="${W-6}" y2="${base}" stroke="${AXIS}" stroke-width="1"/>${out}</svg>`;
    }

    /* Single-series line — one series needs no legend, the title names it */
    function svgLine(pts, opts){
      opts=opts||{};
      // L/R inset by half a label width so the first/last centred labels
      // ("MAY", "AUG 17") don't spill outside the viewBox.
      const W=320, H=opts.h||170, top=18, base=H-40, L=28, R=W-28;
      const vals=pts.map(p=>p[1]);
      const max=Math.max(...vals)*1.1, min=0;
      const x=i=>L+i*((R-L)/(pts.length-1));
      const y=v=>base-(v-min)/(max-min)*(base-top);
      const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(' ');
      const area=line+` L${x(pts.length-1).toFixed(1)} ${base} L${x(0).toFixed(1)} ${base} Z`;
      let dots='';
      pts.forEach((p,i)=>{
        dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="4.5" fill="${CHART.c1}" stroke="#111624" stroke-width="2"><title>${p[0]}: ${money0(p[1])}</title></circle>`;
        dots+=`<text x="${x(i).toFixed(1)}" y="${(y(p[1])-11).toFixed(1)}" text-anchor="middle" font-family="B612 Mono,monospace" font-size="10" font-weight="700" fill="${INK}">${money0(p[1])}</text>`;
        dots+=`<text x="${x(i).toFixed(1)}" y="${base+16}" text-anchor="middle" font-family="Satoshi,system-ui,sans-serif" font-weight="600" font-size="11" letter-spacing=".06em" fill="${MUTED}">${p[0].toUpperCase()}</text>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${opts.alt||''}">
        <defs><linearGradient id="lnFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${CHART.c1}" stop-opacity=".28"/><stop offset="100%" stop-color="${CHART.c1}" stop-opacity="0"/>
        </linearGradient></defs>
        <line x1="${L}" y1="${base}" x2="${R}" y2="${base}" stroke="${AXIS}" stroke-width="1"/>
        <path d="${area}" fill="url(#lnFill)"/>
        <path d="${line}" fill="none" stroke="${CHART.c1}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}</svg>`;
    }

    function chartsHTML(){
      // Figures from the CIBC statements (May 17 – Aug 22 window). Aug is 1–17
      // actual, scaled to a 31-day rate where a monthly comparison is needed.
      const transport=[

    function historyHTML(s){
      const days=s.days||{};
      const isAnchored=d=>!!d&&(d.anchor===true||d.completed===true); // completed = legacy days
      const dayStat=k=>{const d=days[k];if(!d)return 'none';
        if(isAnchored(d)&&dayGains(d)>=18)return 'full';   // anchored + real wins
        if(isAnchored(d)||dayGains(d)>0)return 'part';     // showed up, or wins without anchor
        return 'none';};
      const pctOver=n=>{let c=0;for(let i=0;i<n;i++){if(isAnchored(days[addDaysStr(Dash.today,-i)]))c++;}return Math.round(c/n*100);};
      const p7=pctOver(7),p30=pctOver(30);
      const anchorTotal=Object.keys(days).filter(k=>isAnchored(days[k])).length;

      const WEEKS=16;
      let start=addDaysStr(Dash.today,-(WEEKS*7-1));
      const sdow=(new Date(start+'T00:00:00').getDay()+6)%7;
      start=addDaysStr(start,-sdow);
      const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      let cells='',months='';
      for(let w=0;;w++){
        const wk=addDaysStr(start,w*7);
        if(wk>Dash.today)break;
        const wd=new Date(wk+'T00:00:00');
        months+=`<span>${wd.getDate()<=7?MON[wd.getMonth()]:''}</span>`;
        for(let r=0;r<7;r++){
          const ds=addDaysStr(start,w*7+r);
          if(ds>Dash.today){cells+='<span></span>';continue;}
          const st=dayStat(ds);
          const nice=new Date(ds+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
          cells+=`<button class="hmCell ${st==='none'?'':st}${ds===Dash.today?' today':''}" data-hday="${ds}" aria-label="${nice}: ${st==='full'?'deep day':st==='part'?'showed up':'quiet day'}" title="${nice}"></button>`;
        }
      }
      const DOW=['M','','W','','F','',''];
      const xp=calcXP(s), lv=levelInfo(xp);
      const m=momentumNow(s);
      return `
        <div class="card">
          ${secTitle('RECORD','The Record')}
          <div class="tiles">
            ${statTile(actionDays(s)+'/'+ACTION_WINDOW,'action days · last '+ACTION_WINDOW,'idle')}
            ${statTile(m,'momentum · earned',m>=50?'good':'idle')}
            ${statTile(anchorTotal,'days showed up',anchorTotal>0?'good':'idle')}
            ${statTile(xp,'actions completed',xp>0?'good':'idle')}
            ${statTile('L'+(lv.idx+1),lv.name,'idle')}
            ${statTile(p7+'%','anchored · last 7 days',p7>=70?'good':'idle')}
            ${statTile(p30+'%','anchored · last 30 days',p30>=70?'good':'idle')}
            ${statTile(s.best,'best run · legacy streak','idle')}
          </div>
        </div>
        <div class="card">
          ${secTitle('LOG','Flow History','16 weeks')}
          <div class="hmWrap">
            <div style="display:flex">
              <div class="hmDow">${DOW.map(x=>`<span>${x}</span>`).join('')}</div>
              <div>
                <div class="hmMonths">${months}</div>
                <div class="hmGrid">${cells}</div>
              </div>
            </div>
          </div>
          <div class="hmLegend">
            <span><i style="background:var(--customs)"></i>Deep day</span>
            <span><i style="background:rgba(79,216,235,.32)"></i>Showed up</span>
            <span><i style="background:#131A29;border:1px solid var(--line)"></i>Quiet</span>
          </div>
          <div style="font-size:12.5px;color:var(--sub);margin-top:8px">Quiet days are allowed — they cost a little momentum, never your history. Tap any day to inspect or amend it.</div>
        </div>`;
    }

    function openHydroModal(){
      const ov=document.createElement('div'); ov.className='overlay'; ov.id='dashModal';
      const hhmm=()=>new Date().toTimeString().slice(0,5);
      const applyHydro=(arr)=>{
        // Writes only hydro/water/log.water rather than replacing the whole day.
        // Replacing it meant a sip logged here would wipe a gym tap made on
        // another device in the same day — the read-modify-write P0.2 exists to
        // remove.
        const day=Dash.state.days[Dash.today]||{};
        const goal=(Dash.state.config&&Dash.state.config.waterGoal)||2500;
        const total=arr.reduce((t,x)=>t+(x.ml||0),0);
        const was=day.water===true;
        const hit=total>=goal; // Hydrate win is derived from real ml, never hand-toggled
        const base=`days.${Dash.today}`;
        const patch={ [`${base}.hydro`]:arr, [`${base}.water`]:hit };
        patch[`${base}.log.water`] = hit ? (was ? (day.log&&day.log.water)||hhmm() : hhmm()) : Dash.REMOVE;
        if(hit&&!was) flowToast('💧 Goal hit — Hydrate stamped');
        Dash.setMany(patch);
        render();
      };
      const render=()=>{
        const d=Dash.state.days[Dash.today]||{};
        const hyd=d.hydro||[];
        const total=hyd.reduce((t,x)=>t+(x.ml||0),0);
        const goal=(Dash.state.config&&Dash.state.config.waterGoal)||2500;
        const pct=Math.min(100,Math.round(total/goal*100));
        const rows=BOTTLES.map(([id,e,l,ml])=>`
          <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)">
            <span style="font-size:19px" aria-hidden="true">${e}</span>
            <span style="flex:1"><b style="font-size:14px">${l}</b><div style="font-size:11.5px;color:var(--sub);font-family:var(--mono)">${ml} ml</div></span>
            <button class="chip" data-sip="${ml}" aria-label="Log full ${l} — ${ml} ml">Full</button>
            <button class="chip" data-sip="${Math.round(ml/2)}" aria-label="Log half ${l} — ${Math.round(ml/2)} ml">½</button>
          </div>`).join('');
        const logList=hyd.length
          ? hyd.slice().reverse().map(x=>`<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--sub);padding:3px 0"><span>${x.t}</span><span>${x.ml} ml</span></div>`).join('')
          : '<div style="font-size:12.5px;color:var(--sub)">Nothing logged yet today.</div>';
        ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Hydration">

    /* ---------- Plan tab: timetable data comes from schedule.json (shared with the notification sender) ---------- */

    const todow=ds=>new Date(ds+'T00:00:00').getDay();

    const toM=t=>{const p=t.split(':');return (+p[0])*60+(+p[1]);};

    function legacyScheduleHTML(s){
      if(!SCHEDS) return `<div class="card">${secTitle('WEEK','Next 7 Days')}<p style="color:var(--sub);font-size:14px;margin:0">Couldn't load schedule.json — check your connection and reload.</p></div>`;
      const days=s.days||{};
      const DNAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const week=Array.from({length:7},(_,i)=>addDaysStr(Dash.today,i));
      const DN=week.map(ds=>DNAMES[todow(ds)]);
      const sel=(planDay&&week.indexOf(planDay)>=0)?planDay:Dash.today;
      const kind=kindOf(todow(sel));
      const title=KIND_TITLES[kind]||kind;
      const blocks=SCHEDS[kind]||[];
      const d=days[sel]||{}; const sched=d.sched||{};
      const editable=sel<=Dash.today;
      const isToday=sel===Dash.today;
      const n=new Date(); const nowM=n.getHours()*60+n.getMinutes();
      const fineSum=dd=>(dd&&dd.fines)?dd.fines.reduce((t,k)=>{const f=FINES.find(x=>x[0]===k);return t+(f?f[3]:0);},0):0;
      let done=0,missed=0;
      const rows=blocks.map((b,i)=>{
        const [k,st,en,e,l]=b;
        const v=sched[k];
        const endM=en?toM(en):(blocks[i+1]?toM(blocks[i+1][1]):24*60);
        const isNow=isToday&&nowM>=toM(st)&&nowM<endM;
        if(v===true)done++; else if(v==='fail')missed++;
        const cls=v===true?'done':v==='fail'?'fail':'';
        const stTxt=v===true?'DONE ✓':v==='fail'?'SKIP':(isNow?'NOW':editable?'···':'—');
        const tog=editable?` role="button" tabindex="0" data-toggle="days.${sel}.sched.${k}"`:` style="cursor:default"`;
        return `<div class="tl ${cls}${isNow&&!v?' now':''}"${tog} aria-label="${l}: ${v===true?'done':v==='fail'?'skipped':'pending'}">

      }).join('');
      const chips=week.map((ds,i)=>`<button class="dayChip${ds===sel?' sel':''}${ds===Dash.today?' tdy':''}" data-plday="${ds}" aria-label="${DN[i]} ${ds}"><div class="dn">${DN[i]}</div><div class="dd">${+ds.slice(8)}</div></button>`).join('');
      const glance=week.map((ds,i)=>{
        const kw=kindOf(todow(ds));
        const label=GLANCE[kw]||'';
        const dd=days[ds]; const fined=fineSum(dd);
        const mark=ds<Dash.today?(dd&&dd.completed===true?'✓':'·'):ds===Dash.today?'●':'';
        return `<div style="display:flex;gap:10px;align-items:baseline;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:13px${ds===Dash.today?';font-weight:700':''}">

      }).join('');
      const finesWeek=week.reduce((t,ds)=>t+fineSum(days[ds]),0);
      const officeN=week.filter(ds=>kindOf(todow(ds))==='office').length;
      const satN=week.filter(ds=>kindOf(todow(ds))==='sat').length;
      // Groceries only. This used to add $6.50 per office day of bus fare, which
      // stopped being real when the commute became a car — the driving cost is
      // already carried by the gas budget, so counting it here billed it twice.
      const planSpend=Math.round(satN*80);
      return `
        <div class="card">
          ${secTitle('WEEK','Next 7 Days', finesWeek?`$${finesWeek} leaked`:'no leaks', finesWeek?'var(--sub)':'var(--customs)')}
          ${glance}
          <div style="font-size:12.5px;color:var(--sub);margin-top:8px"><b style="color:var(--ink)">Planned spend, next 7 days: ~$${planSpend}</b> — groceries $${satN*80}. Driving is covered by the gas budget. Everything else is $0 by design: cooked meals, gym near home, no rentals.</div>
        </div>
        <div class="card">
          ${secTitle('TIMETABLE',`${title}${isToday?' — today':''}`,`${done}/${blocks.length}${missed?' · '+missed+' skipped':''}`, 'var(--customs)')}
          <div class="wkRow">${chips}</div>
          ${rows}
          <div style="font-size:12px;color:var(--sub);margin-top:6px">${editable?'Tap a block when done · tap again = SKIP · again = clear. Glowing = right now.':'Future day — preview only.'} This is the machine that produces your wins — skipping a block is information, not failure.</div>
        </div>
        <div class="card">
          ${secTitle('ROUTE','Getting there')}
          <div style="font-size:13.5px;color:var(--ink);line-height:1.6">
            🛣️ <b>Home → work:</b> leave around 7:30 on an office day.<br>
            🏋️ <b>Gym:</b> 710 Proudfoot Ln — near home.<br>
            ⛽ Driving costs live in the gas budget above, from logged fill-ups.
          </div>
        </div>`;

    function flowToast(msg){
      // FLOWSTATE celebration: a quiet glow, never noise. No confetti, no

      const toast=document.createElement('div'); toast.className='toast'; toast.setAttribute('role','status');

    /* ---------- render ----------
       The hero pointer-trail (a port of the 21st.dev image-mousetrail) used to
       be mounted here. Deleted in FLOWSTATE II: pointermove barely fires on
       touch, so on the device this app actually runs on it was invisible work
       occupying the most valuable pixels on the screen. */
    let lastTab=null, lastM=null;

    function draw(s){
      const root=document.getElementById('appRoot');
      const focused=document.activeElement;
      const focusAttr=root.contains(focused) ? Array.from(focused.attributes||[]).find(a=>['data-ci','data-ci-act','data-ci-phase','data-pref','data-pref-snooze','data-toggle'].includes(a.name)) : null;
      const focusToken=focusAttr ? {name:focusAttr.name,value:focusAttr.value} : null;
      const d=(s.days&&s.days[Dash.today])||{};
      const anchoredNow=d.anchor===true;
      const bigNow=BIG_KEYS.filter(k=>d[k]===true).length;
      const mNow=momentumNow(s);

      applyMood();
      const tabChanged = tab!==lastTab;
      // The status element is recreated by every redraw, so the live state has
      // to be repainted onto it or it reverts to whatever the template said.
      queueMicrotask(paintSync);

      root.querySelectorAll('details[data-disclosure]').forEach(el=>openDisclosures.set(el.dataset.disclosure,el.open));
      const content = tab==='today'?todayHTML(s,d)
        :tab==='plan'?schedHTML(s)
        :tab==='pr'?prHTML(s)
        :tab==='money'?moneyHTML(s)
        :tab==='health'?healthHTML()
        :tab==='schedule'?legacyScheduleHTML(s)
        :tab==='history'?midnight.record({state:s,history:historyHTML(s)})
        :moreHTML(s);
      const reference=['pr','money','health','schedule'].includes(tab)
        ? '<p class="reference-note">Saved reference material. Verify dates, figures, and guidance before relying on them. This is not live Google data.</p>' : '';
      root.innerHTML = midnight.header(Dash.today,tab)+`<main id="viewContent" tabindex="-1" class="${tab==='more'?'more-view':''}">${reference}${content}</main>`+navHTML();
      root.querySelectorAll('details[data-disclosure]').forEach(el=>{
        if(openDisclosures.has(el.dataset.disclosure)) el.open=openDisclosures.get(el.dataset.disclosure);
        el.addEventListener('toggle',()=>openDisclosures.set(el.dataset.disclosure,el.open));
      });
      root.querySelectorAll('[data-ci-phase]').forEach(el=>el.addEventListener('click',()=>{ciPhase=el.dataset.ciPhase;draw(Dash.state);}));

      /* The ring fill — the most satisfying moment in the app, and until now it
         didn't move: the SVG was simply re-rendered at the new dash offset.
         Rewind to the previous value and spring forward. Only when Motion is
         confirmed present, so the static fallback is always the true value.
         [data-c] matters: the blurred glow twin also carries .ringArc but has
         no dataset, and it is the one querySelector would find first.
         Rewind via setAttribute, NOT style — Motion animates SVG geometry by
         writing attributes, and an inline style outranks an attribute, so a
         style rewind pins the arc at the start value forever. */
      const arc=root.querySelector('.ringArc[data-c]');
      if(arc && moving()){
        const C=parseFloat(arc.dataset.c);
        const toM=parseFloat(arc.dataset.m);
        const fromM=(lastM==null)?0:lastM;              // first open sweeps up from empty
        if(fromM!==toM){
          const from=C*(1-fromM/100), to=C*(1-toM/100);
          const arcs=root.querySelectorAll('.ringArc');
          arcs.forEach(a=>a.setAttribute('stroke-dashoffset', from.toFixed(1)));
          spring(arcs,{strokeDashoffset:[from,to]},{stiffness:110,damping:17,mass:1});
          countUp(root.querySelector('.ringNum'), fromM, toM, 950);
        }
      }
      if(arc) lastM=parseFloat(arc.dataset.m);

      /* Cards arrive instead of appearing — but only on a tab change. Staggering
         on every tap would make logging a win feel like a page load. */
      if(tabChanged && moving()){
        const cards=root.querySelectorAll('.cover, .card');
        if(cards.length) spring(cards,{opacity:[0,1],y:[16,0]},
          {stiffness:230,damping:26,delay:MO.stagger?MO.stagger(0.035):0});
      }
      lastTab=tab;

      // Tag only the just-tapped element so its completion animation fires once,
      // instead of every completed item re-animating on every render.
      if(Dash._lastSet){
        const el=root.querySelector('[data-toggle="'+Dash._lastSet+'"]');
        if(el) el.classList.add('justDone');
        Dash._lastSet=null;
      }

      root.querySelectorAll('[data-toggle]').forEach(el=>{
        const fire=()=>{
          const path=el.dataset.toggle;
          const cur=getPath(Dash.state,path);
          // Timetable blocks keep a neutral three-state (done / skip / clear)
          // for honest plan tracking; everything else is a simple on/off —
          // there is no DENIED state anywhere anymore.
          const next = path.includes('.sched.')
            ? (cur===true ? 'fail' : cur==='fail' ? false : true)
            : cur===true ? false : true;
          Dash.set(path,next);
        };
        el.addEventListener('click',fire);
        el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fire(); } });
      });
      /* Check-in controls (P1). Tapping a selected chip clears it — an answer
         given by accident must be as easy to take back as to give. */
      root.querySelectorAll('[data-ci]').forEach(el=>{
        el.addEventListener('click',()=>{
          const [field,val]=el.dataset.ci.split(':');
          const path=`checkIns.${Dash.today}.${field}`;
          Dash.set(path, getPath(Dash.state,path)===val ? Dash.REMOVE : val);
        });
      });
      root.querySelectorAll('[data-ci-text]').forEach(inp=>{
        const save=()=>{
          const v=inp.value.trim();
          if((getPath(Dash.state,`checkIns.${Dash.today}.${inp.dataset.ciText}`)||'')!==v) {
            Dash.set(`checkIns.${Dash.today}.${inp.dataset.ciText}`, v || Dash.REMOVE, {render:false});
            const step=root.querySelector('.step-title');
            if(step && inp.dataset.ciText==='firstStep') {
              const focus=v || (Dash.state.checkIns?.[Dash.today]?.focus==='rest'?'Make room for rest.':'');
              step.textContent=focus || 'What matters to you today?';
              step.previousElementSibling.textContent=focus?'YOUR CHOSEN STEP':'A LITTLE DIRECTION';
              step.nextElementSibling.textContent=focus?'An intention you chose. Go at your own pace.':'Find your next action in your full checklist.';
            }
          }
        };
        // Blur, not input: re-rendering on every keystroke would steal the caret.
        inp.addEventListener('change',save);
        inp.addEventListener('blur',save);
      });
      root.querySelectorAll('[data-ci-act]').forEach(el=>{
        el.addEventListener('click',()=>{
          const act=el.dataset.ciAct, base=`checkIns.${Dash.today}`;
          if(act==='close')       Dash.set(`${base}.closed`, true);
          else if(act==='reopen') Dash.set(`${base}.closed`, Dash.REMOVE);
          else if(act==='skip')   Dash.set(`${base}.closed`, true);   // skipping IS closing; nothing is owed
          else if(act==='skipmorning') Dash.set(`${base}.morningSkipped`,true);
          else if(act==='reopenmorning') Dash.set(`${base}.morningSkipped`,Dash.REMOVE);
          else if(act==='clearobstacle') Dash.set(`${base}.obstacle`,Dash.REMOVE);
          else if(act==='skipfeeling') Dash.set(`${base}.feeling`, Dash.REMOVE);
          else if(act==='off')    Dash.set('prefs.checkIns', false);
          else if(act==='on')     Dash.set('prefs.checkIns', true);
          else if(act==='delete'){
            // A21: remove every check-in, leave every logged action untouched.
            if(confirm('Delete all check-in answers? Your logged actions, momentum and milestones are not affected.'))
              Dash.set('checkIns', {});
          }
        });
      });
      root.querySelectorAll('[data-pref]').forEach(el=>{
        el.addEventListener('click',()=>{
          const k=el.dataset.pref;
          Dash.set(`prefs.${k}`, !(Dash.state.prefs&&Dash.state.prefs[k]));
        });
      });
      root.querySelectorAll('[data-pref-snooze]').forEach(el=>{
        el.addEventListener('click',()=>{
          const on=(Dash.state.prefs||{}).snoozeUntil===Dash.today;
          Dash.set('prefs.snoozeUntil', on ? Dash.REMOVE : Dash.today);
        });
      });
      root.querySelectorAll('[data-hydro]').forEach(el=>{
        const fire=()=>openHydroModal();
        el.addEventListener('click',fire);
        el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fire(); } });
      });
      root.querySelectorAll('[data-gaslog]').forEach(el=>{
        const fire=()=>openGasModal();
        el.addEventListener('click',fire);
        el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fire(); } });
      });
      root.querySelectorAll('[data-time]').forEach(inp=>{
        inp.addEventListener('click',e=>e.stopPropagation());
        inp.addEventListener('keydown',e=>e.stopPropagation());
        inp.addEventListener('change',()=>Dash.set(inp.dataset.time, inp.value));
      });
      root.querySelectorAll('[data-edit]').forEach(el=>{
        el.addEventListener('click',()=>{
          if(el.dataset.edit==='actionsCount'){
            const card=document.getElementById('actionCard');
            if(card){ window.scrollTo({top:card.offsetTop-70, behavior:REDUCED?'auto':'smooth'});
              card.style.outline='3px solid var(--foil)'; setTimeout(()=>card.style.outline='',1200); }
            return;
          }
          openModal(el.dataset.edit);
        });
      });
      root.querySelectorAll('[data-fine]').forEach(el=>{
        const fire=()=>{
          const cur=(getPath(Dash.state,`days.${Dash.today}.fines`)||[]).slice();
          cur.push(el.dataset.fine);
          Dash.set(`days.${Dash.today}.fines`,cur);
        };
        el.addEventListener('click',fire);
        el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fire(); } });
      });
      const undoBtn=root.querySelector('[data-fineundo]');
      if(undoBtn) undoBtn.addEventListener('click',e=>{
        e.stopPropagation();
        const cur=(getPath(Dash.state,`days.${Dash.today}.fines`)||[]).slice();
        cur.pop();
        Dash.set(`days.${Dash.today}.fines`,cur);
      });
      root.querySelectorAll('[data-plday]').forEach(el=>{
        el.addEventListener('click',()=>{ planDay=el.dataset.plday; draw(Dash.state); });
      });
      root.querySelectorAll('[data-hday]').forEach(el=>{
        el.addEventListener('click',()=>openDayModal(el.dataset.hday));
      });
      root.querySelectorAll('[data-tab]').forEach(el=>{
        el.addEventListener('click',e=>{ e.preventDefault(); tab=el.dataset.tab; draw(Dash.state); window.scrollTo({top:0}); document.getElementById('viewContent')?.focus({preventScroll:true}); });
      });
      const pushBtn=root.querySelector('#pushEnable');
      if(pushBtn) pushBtn.addEventListener('click', async ()=>{
        const msg=root.querySelector('#pushMsg'); if(msg) msg.textContent='Registering this device…';
        const r=await ensurePushToken(true);
        if(r.ok){
          // Success re-renders (token saved via Dash.set) and hides the card — confirm with a toast.
          const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status');
          t.textContent='🔔 Device registered — delivery still needs testing.';
          document.body.appendChild(t); setTimeout(()=>t.remove(),3200);
        } else if(msg){
          msg.textContent = r.reason==='denied' ? 'Blocked — allow notifications for this site in Chrome settings, then retry.'
            : r.reason==='unsupported' ? "This browser doesn't support web push."
            : r.reason==='setup' ? 'Push isn\'t configured yet — VAPID key missing (see NOTIFICATIONS-SETUP.md).'
            : 'Couldn\'t register — check your connection and retry.';
        }
      });

      if(prevAnchor===false && anchoredNow) flowToast(`⚓ Anchor logged — momentum ${momentumNow(s)}`);
      if(prevBig!==null && bigNow>prevBig) flowToast(`⚡ Big win — momentum ${momentumNow(s)}`);
      if(focusToken){
        let next=Array.from(root.querySelectorAll('['+focusToken.name+']')).find(el=>el.getAttribute(focusToken.name)===focusToken.value);
        if(!next && focusToken.name==='data-ci-act'){
          const alternate={close:'reopen',skip:'reopen',reopen:'close',off:'on',skipmorning:'reopenmorning'}[focusToken.value];
          if(alternate) next=root.querySelector('[data-ci-act="'+alternate+'"]');
        }
        (next || root.querySelector('[data-ci-phase]') || root.querySelector('main'))?.focus({preventScroll:true});
      }
      prevAnchor=anchoredNow;
      prevBig=bigNow;
    }

    /* Hold the very first paint for Motion — but never for long. The opening
       ring sweep from 0 is the signature moment; losing it to a cold CDN import
       would mean the app's first impression is a static number. 700 ms is the
       ceiling: past that the app draws anyway, unanimated. motionReady starts
       at module parse, well before the Firestore read finishes, so on a warm
       cache this resolves instantly and costs nothing. */
    Promise.race([motionReady, new Promise(r=>setTimeout(r,700))]).then(()=>Dash.render(draw));
  })();
}
</script>
</body>
</html>
