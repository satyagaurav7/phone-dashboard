name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The DOM tests need jsdom. It lives in tests/package.json, and without
      # this step CI silently skipped every test that imports it.
      - name: Install test dependencies
        run: npm ci --prefix tests
      - name: Run local contract tests
        run: node --test tests/*.test.mjs
      - name: Build the site artifact
        run: node scripts/build-site.mjs --out _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the reviewed manifest in scripts/build-site.mjs is published.
          # Never restore `path: .` — that published every tracked file,
          # including the personal planning documents in the repository root.
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
