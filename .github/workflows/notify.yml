name: Notifications

# Every scheduled run calls notify.mjs --mode=auto: the script reads the
# Toronto wall clock + Firestore notifyLog and decides what (if anything) is
# due — morning brief, a tap-window nudge, or the 9 PM anchor reminder.
# GitHub cron can still land late. A 10-minute cadence bounds ordinary delay
# far more tightly than the old DST-paired hourly jobs.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which notification to send'
        type: choice
        options: [auto, brief, streak]
        default: auto
      force:
        description: 'Ignore the time guard (brief/streak only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install sender deps
        run: npm install --no-audit --no-fund
        working-directory: scripts
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "flags=${{ inputs.force && '--force' || '' }}" >> "$GITHUB_OUTPUT"
          else
            # Scheduled runs always use auto — the script decides what's due.
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi
      - name: Send notification
        run: node scripts/notify.mjs --mode=${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.flags }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Preview Beeminder datapoints
        run: node scripts/stakes.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
