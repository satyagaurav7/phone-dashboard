name: Calendar sync

# Automatic routine publishing paused on 2026-09-05 for the Google-native setup.
# Personal to-dos belong in Google Tasks; primary Calendar is for commitments.
# This workflow is now inspection-only: it cannot recreate calendar clutter
# or delete yesterday's generated tasks. Existing Google data is unchanged.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to preview (no Google writes)'
        default: '7'

permissions:
  contents: read

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --no-audit --no-fund
        working-directory: scripts
      - name: Preview calendar (no writes)
        run: node scripts/sync-calendar.mjs --days="$PREVIEW_DAYS" --dry-run
        env:
          PREVIEW_DAYS: ${{ inputs.days || '7' }}
      - name: Preview routine tasks (no writes)
        run: node scripts/sync-tasks.mjs --dry-run
